services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_RPM
        value: "3"
      - key: LLM_API_KEY
        sync: false
      - key: TEAM_NAME
        value: Aarav Jhamb
      - key: TEAM_MEMBER
        value: Aarav Jhamb
      - key: CONTACT_EMAIL
        sync: false
